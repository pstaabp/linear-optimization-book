<figure class="listing figure-like"><figcaption><span class="type">Listing</span><span class="space heading-divison-mark heading-divison-mark__space"> </span><span class="codenumber">5.5.2<span class="period heading-divison-mark heading-divison-mark__period">.</span></span><span class="space heading-divison-mark heading-divison-mark__space"> </span>Code for the 4-queens problem in Julia<div class="autopermalink" data-description="Listing 5.5.2: Code for the 4-queens problem in Julia"><a href="#lst-4-queens-julia" title="Copy heading and permalink for Listing 5.5.2: Code for the 4-queens problem in Julia" aria-label="Copy heading and permalink for Listing 5.5.2: Code for the 4-queens problem in Julia">🔗</a></div></figcaption><div class="listing__contents"><div class="code-box"><pre class="program clipboardable line-numbers"><code class="language-none">m2 = Model(HiGHS.Optimizer)
n = 4
P = [ i+j == n+1 ? 1 : 0 for i=1:n, j=1:n]
@variable(m2, x[1:n,1:n], Bin)
@constraint(m2, c1, mapslices(sum, x, dims = [1]) .&lt;= ones(1,n))
@constraint(m2, c2, mapslices(sum, x, dims = [2]) .&lt;= ones(n,1))
@constraint(m2, c3, [sum(diagm(i=&gt;ones(n-abs(i))).*x) for i=-(n-2):(n-2)] .&lt;= ones(2n-3))
@constraint(m2, c4, [sum(P*diagm(i=&gt;ones(n-abs(i))).*x) for i=-(n-2):(n-2)] .&lt;= ones(2n-3))
@objective(m2, Max, sum([x[i,j] for i=1:n, j=1:n]))
</code></pre></div></div></figure><span class="incontext"><a class="internal" href="sect-ilop-julia.html#lst-4-queens-julia">in-context</a></span>
